name: Build iOS App

on:
  # push:
  #   branches: [ "release" ]
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch to build'
        required: true
        default: 'release'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.build_branch || github.ref }}
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties
      run: |
        touch local.properties
        echo "INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}" >> local.properties
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
        echo "IMDB_RATINGS_API_BASE_URL=${{ secrets.IMDB_RATINGS_API_BASE_URL }}" >> local.properties
        echo "IMDB_TAPFRAME_API_BASE_URL=${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}" >> local.properties
        echo "TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}" >> local.properties
        echo "TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}" >> local.properties
        echo "TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}" >> local.properties
        echo "PREMIUMIZE_CLIENT_ID=${{ secrets.PREMIUMIZE_CLIENT_ID }}" >> local.properties
        echo "CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}" >> local.properties
        echo "DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}" >> local.properties
        echo "DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}" >> local.properties

    - name: Compute build version
      id: version
      run: |
        version="1.0.${{ github.run_number }}"
        echo "name=$version" >> $GITHUB_OUTPUT

    - name: Build Unsigned iOS App
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build

    - name: Package IPA
      run: |
        cd iosApp/build/Release-iphoneos
        mkdir Payload
        mv iosApp.app Payload/
        zip -r NuvioMobile.ipa Payload

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "ios-v${{ steps.version.outputs.name }}"
        name: "iOS Mobile v${{ steps.version.outputs.name }}"
        draft: false
        prerelease: true
        files: iosApp/build/Release-iphoneos/NuvioMobile.ipa
