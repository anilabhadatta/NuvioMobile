name: Android Build v2

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch to build'
        required: true
        default: 'release'

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          # Just use a dummy version for testing or extract from run number
          echo "version=test-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  android:
    name: Android Build v2
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          ref: release

      - name: Clean stale submodule references and fetch
        run: |
          # Remove stale mpvKt submodule from git index and config
          git rm --cached mpvKt 2>/dev/null || true
          git config --file .gitmodules --remove-section submodule.mpvKt 2>/dev/null || true
          git config --file .git/config --remove-section submodule.mpvKt 2>/dev/null || true
          rm -rf .git/modules/mpvKt 2>/dev/null || true
          rm -rf mpvKt 2>/dev/null || true
          # Initialize and fetch submodules cleanly
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write runtime config to local.properties
        uses: ./.github/actions/write-runtime-config
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          trakt-client-id: ${{ secrets.TRAKT_CLIENT_ID }}
          trakt-client-secret: ${{ secrets.TRAKT_CLIENT_SECRET }}
          trakt-redirect-uri: ${{ secrets.TRAKT_REDIRECT_URI }}
          introdb-api-url: ${{ secrets.INTRODB_API_URL }}
          imdb-ratings-api-base-url: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          imdb-tapframe-api-base-url: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          contributions-url: ${{ secrets.CONTRIBUTIONS_URL }}
          donations-base-url: ${{ secrets.DONATIONS_BASE_URL }}
          donations-donate-url: ${{ secrets.DONATIONS_DONATE_URL }}

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set. Cannot sign APK."
            exit 1
          fi
          keystore_path="$GITHUB_WORKSPACE/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          {
            echo ""
            echo "NUVIO_RELEASE_STORE_FILE=$keystore_path"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties

      - name: Build per-ABI release APKs (full + playstore)
        run: |
          ./gradlew \
            :androidApp:assembleFullRelease \
            -Pnuvio.splitAbi=true \
            --stacktrace
            
      - name: Compute build version
        id: version
        run: |
          # Add an offset to match the old workflow's run count
          version="1.0.$(($GITHUB_RUN_NUMBER + 16))"
          echo "name=$version" >> $GITHUB_OUTPUT
        
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android-v${{ steps.version.outputs.name }}"
          name: "Android Mobile v${{ steps.version.outputs.name }}"
          draft: false
          prerelease: true
          files: androidApp/build/outputs/apk/full/release/*.apk
