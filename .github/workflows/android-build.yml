name: Build Android App

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties
      run: |
        touch local.properties
        echo "INTRODB_API_URL=https://api.introdb.app" >> local.properties

    - name: Compute build version
      id: version
      run: |
        version="1.0.${{ github.run_number }}"
        echo "name=$version" >> $GITHUB_OUTPUT

    - name: Build Android APK
      run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "android-v${{ steps.version.outputs.name }}"
        name: "Android Mobile v${{ steps.version.outputs.name }}"
        draft: false
        prerelease: true
        files: androidApp/build/outputs/apk/full/release/*.apk
