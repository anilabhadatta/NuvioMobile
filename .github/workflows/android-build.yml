name: Build Android App

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch to build'
        required: true
        default: 'release'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.build_branch || github.ref }}
        lfs: true
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -dname "CN=Nuvio, OU=App, O=Nuvio, L=City, S=State, C=US" -storepass password -keypass password

    - name: Create local.properties
      run: |
        touch local.properties
        echo "NUVIO_RELEASE_STORE_FILE=${{ github.workspace }}/release.jks" >> local.properties
        echo "NUVIO_RELEASE_STORE_PASSWORD=password" >> local.properties
        echo "NUVIO_RELEASE_KEY_ALIAS=release" >> local.properties
        echo "NUVIO_RELEASE_KEY_PASSWORD=password" >> local.properties
        echo "INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}" >> local.properties
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
        echo "IMDB_RATINGS_API_BASE_URL=${{ secrets.IMDB_RATINGS_API_BASE_URL }}" >> local.properties
        echo "IMDB_TAPFRAME_API_BASE_URL=${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}" >> local.properties
        echo "TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}" >> local.properties
        echo "TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}" >> local.properties
        echo "TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}" >> local.properties
        echo "PREMIUMIZE_CLIENT_ID=${{ secrets.PREMIUMIZE_CLIENT_ID }}" >> local.properties
        echo "CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}" >> local.properties
        echo "DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}" >> local.properties
        echo "DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}" >> local.properties

    - name: Compute build version
      id: version
      run: |
        version="1.0.${{ github.run_number }}"
        echo "name=$version" >> $GITHUB_OUTPUT

    - name: Build Android APK
      run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full --no-configuration-cache

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "android-v${{ steps.version.outputs.name }}"
        name: "Android Mobile v${{ steps.version.outputs.name }}"
        draft: false
        prerelease: true
        files: androidApp/build/outputs/apk/full/release/*.apk
